<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength | Portfolio</title>
    <link rel="stylesheet" href="password.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="icon">🔒</div>
                <h1>Password Strength</h1>
                <p class="subtitle">Check your password security</p>
            </div>

            <div class="password-input-wrapper">
                <input type="password" id="password-input" placeholder="Enter your password...">
                <button class="toggle-password" id="toggle-password">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <div class="char-count" id="char-count">0 characters</div>

            <div class="strength-meter">
                <div class="strength-bar" id="strength-bar"></div>
                <div class="strength-text" id="strength-text">Enter a password</div>
            </div>

            <div class="requirements">
                <h3>Requirements</h3>
                <div class="req-item" id="req-length">
                    <i class="fas fa-circle"></i>
                    <span>At least 8 characters</span>
                </div>
                <div class="req-item" id="req-uppercase">
                    <i class="fas fa-circle"></i>
                    <span>One uppercase letter</span>
                </div>
                <div class="req-item" id="req-lowercase">
                    <i class="fas fa-circle"></i>
                    <span>One lowercase letter</span>
                </div>
                <div class="req-item" id="req-number">
                    <i class="fas fa-circle"></i>
                    <span>One number</span>
                </div>
                <div class="req-item" id="req-special">
                    <i class="fas fa-circle"></i>
                    <span>One special character (!@#$%^&*)</span>
                </div>
            </div>

            <button class="copy-btn" id="copy-btn" disabled>
                <i class="fas fa-copy"></i> Copy Password
            </button>
        </div>
    </div>

    <script src="password.js"></script>
</body>

</html>"""

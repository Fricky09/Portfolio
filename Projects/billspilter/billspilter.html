<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Splitter | Portfolio</title>
    <link rel="stylesheet" href="billspliter.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="icon">💰</div>
                <h1>Bill Splitter</h1>
                <p class="subtitle">Split expenses fairly with friends</p>
            </div>

            <div class="input-group">
                <label for="bill-amount">Bill Amount ($)</label>
                <input type="number" id="bill-amount" placeholder="0.00" min="0" step="0.01">
            </div>

            <div class="input-group">
                <label for="people-count">Number of People</label>
                <input type="number" id="people-count" placeholder="2" min="1" value="2">
            </div>

            <div class="input-group">
                <label>Tip Percentage</label>
                <div class="tip-buttons">
                    <button class="tip-btn" data-tip="0">No Tip</button>
                    <button class="tip-btn" data-tip="5">5%</button>
                    <button class="tip-btn" data-tip="10">10%</button>
                    <button class="tip-btn" data-tip="15">15%</button>
                    <button class="tip-btn" data-tip="20">20%</button>
                    <button class="tip-btn active" data-tip="25">25%</button>
                </div>
                <input type="number" id="custom-tip" placeholder="Custom %" min="0" max="100">
            </div>

            <div class="results">
                <div class="result-row">
                    <span class="result-label">Tip Amount:</span>
                    <span class="result-value" id="tip-amount">$0.00</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Total Amount:</span>
                    <span class="result-value" id="total-amount">$0.00</span>
                </div>
                <div class="result-row highlight">
                    <span class="result-label">Each Person Pays:</span>
                    <span class="result-value" id="per-person">$0.00</span>
                </div>
            </div>
        </div>

        <button class="reset-btn" onclick="resetCalculator()">🔄 Reset</button>
    </div>
    </div>

    <script src="billspilter.js"></script>
</body>

</html>"""
